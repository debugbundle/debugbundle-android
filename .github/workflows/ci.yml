name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify
        run: make verify GRADLE_RUNNER=wrapper

      - name: App-driven smoke
        run: make smoke GRADLE_RUNNER=wrapper

  connected-device:
    name: Connected Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 36, "37.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run connected checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.api-level == '37.0' && 'google_apis' || 'default' }}
          arch: x86_64
          script: sh scripts/with-android-sdk.sh ./gradlew --no-daemon connectedCheck
